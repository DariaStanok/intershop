plugins {
    id 'java'
    id 'eclipse'
    id 'org.springframework.boot' version '3.5.3' 
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.10.0'
}

group = 'ru.practicum.project'
version = '0.0.3-SNAPSHOT'


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-webflux'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
  implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
  implementation 'io.swagger.core.v3:swagger-annotations:2.2.22'
  implementation 'org.openapitools:jackson-databind-nullable:0.2.6'

  runtimeOnly 'org.postgresql:r2dbc-postgresql'

  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'io.projectreactor:reactor-test'
  testImplementation 'org.mockito:mockito-junit-jupiter'
  testImplementation 'org.mockito:mockito-inline'

  testImplementation 'org.testcontainers:junit-jupiter'
  testImplementation 'org.testcontainers:postgresql'
  testImplementation 'org.springframework.boot:spring-boot-testcontainers'

  testImplementation 'org.springframework.security:spring-security-test'

  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

springBoot {
    mainClass = 'ru.practicum.project.payment.PaymentServiceApplication'
}

openApiGenerate {
    inputSpec = "$rootDir/openapi/payment-service-api.yaml"
    generatorName = "spring"
    outputDir = "$buildDir/generated"
    apiPackage = "ru.practicum.project.payment.api"
    modelPackage = "ru.practicum.project.payment.model"
    invokerPackage = "ru.practicum.project.payment.invoker"
    configOptions = [
        interfaceOnly       : "true",
        reactive            : "true",
        useSpringBoot3      : "true",
        skipDefaultInterface: "true",
        useTags             : "true",
        openApiNullable     : "false"
    ]
}
tasks.compileJava.dependsOn tasks.openApiGenerate
sourceSets.main.java.srcDirs += "$buildDir/generated/src/main/java"

tasks.named('test') {
    useJUnitPlatform()
}
tasks.named('bootJar') {
    archiveFileName = 'payment-service.jar'
}
tasks.named('jar') { enabled = false }
