server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.r2dbc.url=r2dbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:intershop}
spring.r2dbc.username=${POSTGRES_USER:postgres}
spring.r2dbc.password=${POSTGRES_PASSWORD:postgres}
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
payments.base-url=${PAYMENTS_BASE_URL:http://localhost:8081}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false
