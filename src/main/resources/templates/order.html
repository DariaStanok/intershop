<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<title>Заказ</title>
</head>
<body>

	<a href="/orders" style="float: right;"> <b>ЗАКАЗЫ &cudarrr;</b>
	</a>
	<a href="/cart/items" style="float: right;"> <b>КОРЗИНА
			&cudarrr;</b>
	</a>
	<a href="/main/items" style="float: right;"> <b>ГЛАВНАЯ
			&cudarrr;</b>
	</a>

	<h1 style="text-align: center;" th:if="${!newOrder}">Поздравляем!
		Успешная покупка! &#128578;</h1>

	<table style="width: 70%; margin-left: auto; margin-right: auto;">
		<tr>
			<td>
				<h2 th:text="${'Заказ №' + order.getId()}"></h2>
			</td>
		</tr>

		<tr th:each="item : ${order.getItems()}">
			<td>
				<table>
					<tr>
						<td><a th:href="@{'/items/' + ${item.getId()}}"> <img
								width="300" height="300" th:src="@{${item.getImgPath()}}"
								alt="Изображение товара">
						</a></td>
					</tr>

					<tr>
						<td colspan="3" style="text-align: left; padding-left: 4px;">
							<b> <span th:text="${item.getTitle()}"></span> <span
								th:text="${item.getCount()} + ' шт.'" style="margin-left: 10px;"></span>
								<span th:text="${item.getPrice() * item.getCount()} + ' руб.'"
								style="margin-left: 10px;"></span>
						</b>
						</td>
					</tr>
				</table>
			</td>
		</tr>

		<tr>
			<td style="text-align: right;">
				<h3 th:text="'Сумма: ' + ${order.getTotal()} + ' руб.'"></h3>
			</td>
		</tr>
	</table>

</body>
</html>
